<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jack in a Box</title>
<link rel="icon" type="image/svg+xml" href="/static/logo.svg">
<link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div id="gate" class="gate" hidden>
  <form id="gateForm" class="gate-card">
    <img src="/static/logo.svg" alt="" width="64" height="64" style="justify-self:center">
    <h1 style="text-align:center">Jack in a Box</h1>
    <p id="gateMsg"></p>
    <input id="gatePw" type="password" autocomplete="current-password" placeholder="Password" required minlength="6">
    <button class="btn primary" type="submit" id="gateBtn">Sign in</button>
    <p class="err" id="gateErr"></p>
  </form>
</div>

<header class="top">
  <div class="brand"><img class="logo" src="/static/logo.svg" alt="" width="30" height="30"> Jack in a Box</div>
  <div class="pills" id="pills"></div>
  <button class="btn ghost small" id="logout">Sign out</button>
</header>
<nav class="tabs" id="tabs"></nav>
<main id="main"></main>

<div class="savebar" id="savebar" hidden>
  <span>You have unsaved changes</span>
  <button class="btn ghost" id="discard">Discard</button>
  <button class="btn primary" id="save">Save changes</button>
</div>
<div class="toast" id="toast" hidden></div>
<script src="/static/app.js"></script>
</body>
</html>
